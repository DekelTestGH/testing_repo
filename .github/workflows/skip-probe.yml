# CICD-7190 probe: does an app-created check run with conclusion `skipped` satisfy a required check in a merge queue?
name: skip-probe
on:
  pull_request:
  merge_group:
permissions:
  checks: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
        run: |
          gh api "repos/${{ github.repository }}/check-runs" \
            -f name=orca-skip-probe -f head_sha="$SHA" -f status=completed -f conclusion=skipped \
            -f 'output[title]=Skipped (probe)' -f 'output[summary]=CICD-7190 probe'
